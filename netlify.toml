[build]
  base    = "dashboard/client"
  publish = "dist"
  command = "npm run build"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist", "mongoose", "xlsx", "canvas"]

[functions.api]
  included_files = ["netlify/functions/*.json"]

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
